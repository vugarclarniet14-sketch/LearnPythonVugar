
<!DOCTYPE html>
<html lang="az" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonPro - Learn Python Online</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Brython (Python Interpreter) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300" onload="brython()">

    <!-- ⚙ YUXARI SAĞ KÜNC: MENYU VƏ 1 SAATLIQ VAXT SAYĞACI -->
    <div class="fixed top-4 right-4 z-40 flex items-center gap-3">
        <!-- Vaxt Sayğacı -->
        <div id="timer-badge" class="flex items-center gap-1.5 bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 px-3 py-2 rounded-xl text-rose-600 dark:text-rose-400 font-mono text-xs font-bold shadow-sm">
            <span>⏳</span>
            <span id="time-left">60:00</span>
        </div>

        <button onclick="toggleSettingsDrawer(true)" class="p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-base shadow-sm cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition flex items-center gap-2">
            <span>⚙️</span>
            <span class="text-xs font-semibold hidden sm:inline">Menyu</span>
        </button>
    </div>

    <!-- YAN TƏRƏFDƏN AÇILAN PANEL (DRAWER) -->
    <div id="settings-backdrop" onclick="toggleSettingsDrawer(false)" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden transition-opacity duration-300"></div>
    
    <div id="settings-drawer" class="fixed top-0 right-0 h-full w-80 bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col p-6">
        
        <!-- Panel Başlığı -->
        <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-700 mb-6">
            <h3 class="text-base font-bold flex items-center gap-2">👤 Profil və Tənzimləmələr</h3>
            <button onclick="toggleSettingsDrawer(false)" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">✕</button>
        </div>

        <!-- Panel Məzmunu -->
        <div class="flex flex-col gap-6 flex-1 overflow-y-auto pr-1">
            
            <!-- İstifadəçi Profili -->
            <div class="flex flex-col gap-3 p-4 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-xs items-center text-center">
                <img id="drawer-user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Panda" alt="Avatar" class="w-16 h-16 rounded-full object-cover border-2 border-blue-500 shadow-sm">
                
                <div class="w-full flex flex-col items-center">
                    <span id="drawer-user-display-name" onclick="editName()" class="text-sm font-bold cursor-pointer hover:underline text-blue-600 dark:text-blue-400" title="Adı dəyişmək üçün kliklə">Vüqar</span>
                    <span class="text-[11px] text-slate-400 truncate w-full" id="drawer-user-email">vuqar@gmail.com</span>
                </div>

                <!-- Avatar Seçimi -->
                <div class="w-full mt-2 pt-3 border-t border-slate-200 dark:border-slate-700">
                    <label class="text-[11px] font-semibold text-slate-400 uppercase block mb-2">Profil Şəkli Seç</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="changeAvatarPreset('Panda')" class="p-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-blue-50 dark:hover:bg-slate-800 text-xs cursor-pointer">🐼 Panda</button>
                        <button onclick="changeAvatarPreset('Lion')" class="p-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-blue-50 dark:hover:bg-slate-800 text-xs cursor-pointer">🦁 Şir</button>
                        <button onclick="changeAvatarPreset('Tiger')" class="p-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-blue-50 dark:hover:bg-slate-800 text-xs cursor-pointer">🐯 Pələng</button>
                        <button onclick="changeAvatarPreset('Wolf')" class="p-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-blue-50 dark:hover:bg-slate-800 text-xs cursor-pointer">🐺 Canavar</button>
                        <button onclick="changeAvatarPreset('Unicorn')" class="p-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-blue-50 dark:hover:bg-slate-800 text-xs cursor-pointer">🦄 Unicorn</button>
                        <button onclick="changeAvatarPreset('Horse')" class="p-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-blue-50 dark:hover:bg-slate-800 text-xs cursor-pointer">🐴 At</button>
                        <button onclick="changeAvatarPreset('Fox')" class="p-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-blue-50 dark:hover:bg-slate-800 text-xs cursor-pointer">🦊 Tülkü</button>
                        <button onclick="changeAvatarPreset('Boy')" class="p-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-blue-50 dark:hover:bg-slate-800 text-xs cursor-pointer">👦 Oğlan</button>
                        <button onclick="changeAvatarPreset('Girl')" class="p-1 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-blue-50 dark:hover:bg-slate-800 text-xs cursor-pointer col-span-2">👧 Qız</button>
                    </div>
                </div>
            </div>

            <div class="border-t border-slate-200 dark:border-slate-700"></div>

            <!-- Dil Seçimi -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Dil / Language</label>
                <select id="customLanguageSelect" onchange="alert('Dil dəyişdirildi: ' + this.value)" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm shadow-sm cursor-pointer focus:outline-none">
                    <option value="az">🇦🇿 Azərbaycan dili</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="tr">🇹🇷 Türkçe</option>
                    <option value="ru">🇷🇺 Русский</option>
                </select>
            </div>

            <!-- Tema (Dark/Light Mode) -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Görünüş Rejimi</label>
                <button onclick="toggleDarkMode()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm shadow-sm cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700/50 transition">
                    <span id="theme-label">Qaranlıq Rejim</span>
                    <span>🌓</span>
                </button>
            </div>
        </div>
    </div>

    <!-- HEADER / NAVBAR -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-30 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">PythonPro</h1>
            <span id="progress-text" class="text-xs bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 px-2.5 py-1 rounded-full font-medium">İrəliləyiş: 0%</span>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Sola: Dərslərin Siyahısı -->
        <section class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col h-[600px]">
            <h2 class="font-semibold text-lg mb-4">Dərslər (20 Dərs)</h2>
            <div id="lesson-list" class="overflow-y-auto flex-1 space-y-2 pr-2"></div>
        </section>

        <!-- Sağca: Dərs Məzmunu və Kod Editoru -->
        <section class="md:col-span-2 flex flex-col gap-6">
            
            <!-- Dərs Məzmunu -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <h2 id="lesson-title" class="text-xl font-bold mb-3">Dərs seçin</h2>
                <div id="lesson-content" class="text-slate-600 dark:text-slate-300 mb-4 text-sm leading-relaxed space-y-2"></div>
                
                <!-- Quiz Hissəsi (15 Sual) -->
                <div id="quiz-container" class="mt-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hidden">
                    <div class="flex justify-between items-center mb-3">
                        <span id="quiz-counter" class="text-xs font-bold text-blue-600 dark:text-blue-400">Sual 1 / 15</span>
                    </div>
                    <p id="quiz-question" class="font-medium text-sm mb-3"></p>
                    <div id="quiz-options" class="space-y-2"></div>
                    <div id="quiz-feedback" class="mt-3 text-sm font-semibold hidden"></div>
                </div>
            </div>

            <!-- Python Kod Editoru -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col">
                <h3 class="font-semibold text-sm mb-2">İnteraktiv Kod Editoru</h3>
                <textarea id="code-editor" class="w-full h-36 font-mono text-sm p-3 rounded-xl bg-slate-900 text-emerald-400 border border-slate-700 focus:outline-none resize-none" placeholder="print('Salam Python!')"></textarea>
                
                <div class="flex justify-between items-center mt-3">
                    <button onclick="runPythonCode()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded-xl text-sm transition cursor-pointer shadow-sm">Kodu İşlət  ▶</button>
                    <span class="text-xs text-slate-400">Python 3 (Brython)</span>
                </div>

                <div class="mt-3">
                    <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Nəticə (Output):</h4>
                    <pre id="output" class="p-3 rounded-xl bg-slate-900 text-slate-200 font-mono text-xs min-h-[50px] overflow-x-auto"></pre>
                </div>
            </div>

        </section>
    </main>

    <!-- JAVASCRIPT MƏNTİQİ (Brython üçün) -->
    <script type="text/python">
        import sys
        from browser import document, window

        def runPythonCode(ev):
            code = document["code-editor"].value
            output_element = document["output"]
            output_element.text = ""
            
            class OutputWriter:
                def write(self, text):
                    output_element.text += text
            
            sys.stdout = OutputWriter()
            
            try:
                exec(code, {})
            except Exception as e:
                output_element.text = f"Xəta: {e}"

        window.runPythonCode = runPythonCode
    </script>

    <!-- ÜMUMİ JAVASCRIPT SKRİPTLƏRİ -->
    <script>
        let totalSeconds = 3600;
        let timerInterval = null;

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("Vaxtınız bitdi!");
                    return;
                }
                totalSeconds--;
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                document.getElementById('time-left').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            startTimer();
            renderLessons();
            selectLesson(1);
        });

        function toggleSettingsDrawer(open) {
            const drawer = document.getElementById('settings-drawer');
            const backdrop = document.getElementById('settings-backdrop');
            if (open) {
                backdrop.classList.remove('hidden');
                setTimeout(() => drawer.classList.remove('translate-x-full'), 10);
            } else {
                drawer.classList.add('translate-x-full');
                setTimeout(() => backdrop.classList.add('hidden'), 300);
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const themeLabel = document.getElementById('theme-label');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeLabel.innerText = 'Qaranlıq Rejim';
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeLabel.innerText = 'İşıqlı Rejim';
            }
        }

        const lessons = Array.from({ length: 20 }, (_, i) => {
            const num = i + 1;
            const sentences = Array.from({ length: 20 }, (_, s) => 
                `Bu, Python proqramlaşdırma dilinin ${num}-cü dərs hissəsinin ${s + 1}-ci əsas cümləsidir ki, burada mühüm məntiqi anlayış izah olunur.`
            );
            
            const quizQuestions = Array.from({ length: 15 }, (_, q) => ({
                question: `Dərs ${num} - Sual ${q + 1}: Python dilində bu bölmə ilə bağlı doğru ifadə hansıdır?`,
                options: ["Doğru sintaksis budur", "Səhv əmr formatıdır", "Heç biri doğru deyil", "Mötərizə tələb olunmur"],
                correct: 0
            }));

            return {
                id: num,
                title: `Dərs ${num}: Python-da İrəli səviyyə ${num}`,
                content: sentences.join(" "),
                quizList: quizQuestions
            });
        });

        let currentLessonId = 1;
        let currentQuizIndex = 0;
        let completedLessons = JSON.parse(localStorage.getItem('completed_lessons') || '[]');

        function renderLessons() {
            const listEl = document.getElementById('lesson-list');
            if (!listEl) return;
            listEl.innerHTML = '';
            
            lessons.forEach(lesson => {
                const isCompleted = completedLessons.includes(lesson.id);
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl text-sm font-medium transition flex justify-between items-center cursor-pointer ${currentLessonId === lesson.id ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 border border-blue-200 dark:border-blue-800' : 'hover:bg-slate-100 dark:hover:bg-slate-700/50'}`;
                btn.innerHTML = `<span>${lesson.title}</span> ${isCompleted ? '✅' : '📖'}`;
                btn.onclick = () => { selectLesson(lesson.id); currentQuizIndex = 0; };
                listEl.appendChild(btn);
            });

            updateProgress();
        }

        function selectLesson(id) {
            currentLessonId = id;
            const lesson = lessons.find(l => l.id === id);
            if (!lesson) return;
            
            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('lesson-content').innerHTML = `<p>${lesson.content}</p>`;
            
            const quizContainer = document.getElementById('quiz-container');
            quizContainer.classList.remove('hidden');
            renderQuizQuestion(lesson);
            renderLessons();
        }

        function renderQuizQuestion(lesson) {
            const q = lesson.quizList[currentQuizIndex];
            document.getElementById('quiz-counter').innerText = `Sual ${currentQuizIndex + 1} / 15`;
            document.getElementById('quiz-question').innerText = q.question;
            
            const optionsEl = document.getElementById('quiz-options');
            optionsEl.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const optBtn = document.createElement('button');
                optBtn.className = 'w-full text-left px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm hover:bg-blue-50 dark:hover:bg-slate-700 cursor-pointer transition';
                optBtn.innerText = opt;
                optBtn.onclick = () => checkQuiz(idx, q.correct, lesson);
                optionsEl.appendChild(optBtn);
            });

            document.getElementById('quiz-feedback').classList.add('hidden');
        }

        function checkQuiz(selected, correct, lesson) {
            const fb = document.getElementById('quiz-feedback');
            fb.classList.remove('hidden');
            if (selected === correct) {
                fb.className = "mt-3 text-sm font-semibold text-emerald-500";
                fb.innerText = "✔ Düzgün cavab!";
                setTimeout(() => {
                    if (currentQuizIndex < lesson.quizList.length - 1) {
                        currentQuizIndex++;
                        renderQuizQuestion(lesson);
                    } else {
                        fb.innerText = "🎉 Təbriklər! Bu dərsin bütün 15 sualını uğurla tamamladınız.";
                        if (!completedLessons.includes(currentLessonId)) {
                            completedLessons.push(currentLessonId);
                            localStorage.setItem('completed_lessons', JSON.stringify(completedLessons));
                        }
                        renderLessons();
                    }
                }, 1000);
            } else {
                fb.className = "mt-3 text-sm font-semibold text-rose-500";
                fb.innerText = "✖ Səhvdir, yenidən cəhd edin.";
            }
        }

        function updateProgress() {
            const percent = Math.round((completedLessons.length / lessons.length) * 100);
            document.getElementById('progress-text').innerText = `İrəliləyiş: ${percent}%`;
        }

        function changeAvatarPreset(type) {
            let avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${type}`;
            if (type === 'Boy') avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=Felix`;
            else if (type === 'Girl') avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka`;

            document.getElementById('drawer-user-avatar').src = avatarUrl;
        }

        function editName() {
            const currentName = document.getElementById('drawer-user-display-name').innerText;
            const newName = prompt("Yeni adınızı daxil edin:", currentName);
            if (newName && newName.trim() !== "") {
                document.getElementById('drawer-user-display-name').innerText = newName.trim();
            }
        }
    </script>
</body>
</html>
