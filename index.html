
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <title>Mənim Saytım - Dark Mode</title>
  <style>
    /* 1. Standart (Açıq) Rənglər */
    :root {
      --bg-color: #ffffff;
      --text-color: #121212;
      --card-bg: #f4f4f9;
      --btn-bg: #007bff;
      --btn-text: #ffffff;
    }

    /* 2. Qaranlıq (Dark Mode) Rənglər */
    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #f1f1f1;
      --card-bg: #1e1e1e;
      --btn-bg: #bb86fc;
      --btn-text: #000000;
    }

    /* Səhifə Stlləri */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin-top: 20px;
    }

    /* Dark Mode Düyməsi */
    .toggle-btn {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <button class="toggle-btn" id="theme-toggle">🌙 Qaranlıq Rejim</button>

  <div class="card">
    <h2>Xoş gəlmisiniz!</h2>
    <p>Bu, mənim saytımdakı Dark Mode testi üçündür.</p>
  </div>

  <script>
    const toggleBtn = document.getElementById('theme-toggle');

    // Səhifə yüklənəndə əvvəlki seçimi yoxlayırıq
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      toggleBtn.textContent = '☀️ Açıq Rejim';
    }

    // Düyməyə basıldıqda rejimi dəyişirik
    toggleBtn.addEventListener('click', () => {
      let theme = document.documentElement.getAttribute('data-theme');

      if (theme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        toggleBtn.textContent = '🌙 Qaranlıq Rejim';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        toggleBtn.textContent = '☀️ Açıq Rejim';
      }
    });
  </script>

</body>
</html>
