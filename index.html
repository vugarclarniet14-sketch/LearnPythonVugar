
<!DOCTYPE html>
<html lang="az" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonPro - Gamified Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Top Navigation -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-green-500 to-emerald-400 p-2.5 rounded-xl shadow-lg shadow-green-500/30 text-slate-950 font-bold text-xl flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-terminal"></i>
                </div>
                <div>
                    <span class="text-xl font-black tracking-wider bg-gradient-to-r from-green-400 to-emerald-300 bg-clip-text text-transparent">PythonPro</span>
                    <span class="text-xs block text-slate-400 font-medium">Müəllif: Vüqar</span>
                </div>
            </div>

            <!-- Gamification Status Bar -->
            <div class="flex items-center space-x-4">
                <div class="hidden sm:flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700">
                    <i class="fa-solid fa-trophy text-amber-400"></i>
                    <span class="text-xs font-semibold text-slate-300">Səviyyə: <span id="user-level" class="text-amber-400">1</span></span>
                    <div class="w-20 bg-slate-700 h-2 rounded-full overflow-hidden ml-2">
                        <div id="xp-bar" class="bg-gradient-to-r from-green-500 to-emerald-400 h-full w-[20%] transition-all duration-500"></div>
                    </div>
                    <span id="xp-text" class="text-xs font-mono text-green-400 ml-1">20/100 XP</span>
                </div>

                <!-- Theme Toggle -->
                <button onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700" title="Rejimi dəyiş">
                    <i id="theme-icon" class="fa-solid fa-sun text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Welcome Banner -->
        <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-emerald-900/40 via-slate-900 to-slate-900 border border-emerald-500/20 p-8 shadow-2xl">
            <div class="absolute -right-10 -bottom-10 w-72 h-72 bg-green-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="max-w-2xl space-y-4">
                <span class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-green-500/10 border border-green-500/30 text-green-400 text-xs font-semibold">
                    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                    <span>İnteraktiv Təhsil Platforması</span>
                </span>
                <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white leading-tight">
                    Python-u Əylənərək Öyrən və <span class="bg-gradient-to-r from-green-400 to-emerald-300 bg-clip-text text-transparent">Kodla!</span>
                </h1>
                <p class="text-slate-300 text-sm sm:text-base">
                    Sıfırdan peşəkar səviyyəyə qədər real kodlar yaz, tapşırıqları tamamla, xallar topla və irəlilə.
                </p>
                <div class="flex flex-wrap gap-4 pt-2">
                    <a href="#editor-section" class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-slate-950 font-bold px-6 py-3 rounded-xl shadow-lg shadow-green-500/20 transition flex items-center space-x-2">
                        <i class="fa-solid fa-play"></i>
                        <span>İndi Başla</span>
                    </a>
                    <a href="#tasks-section" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold px-6 py-3 rounded-xl transition flex items-center space-x-2">
                        <i class="fa-solid fa-code-commit"></i>
                        <span>Tapşırıqlar Bankı</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Python Editor & Console -->
        <div id="editor-section" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-7 bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl flex flex-col">
                <div class="bg-slate-800/90 px-4 py-3 border-b border-slate-700/80 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                        <div class="w-3 h-3 rounded-full bg-amber-500"></div>
                        <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                        <span class="text-xs font-mono text-slate-400 ml-2">main.py</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="loadPreset(1)" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded text-slate-300 transition">Salam</button>
                        <button onclick="loadPreset(2)" class="text-xs bg-slate-700 hover:bg-slate
